# Secret Scanning Workflow - Prevents credential leaks
# Uses gitleaks to scan for hardcoded secrets before they reach production

name: Secret Scanning

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # Run on all PRs to catch secrets before merge
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      # Use the free gitleaks binary directly. The gitleaks-action@v2 wrapper
      # hard-fails for organisation repos without a paid GITLEAKS_LICENSE
      # secret; the CLI has no such restriction. Run report-only (--exit-code 0)
      # and surface results in the Security tab: this is a pentest tool repo
      # whose payloads/fixtures legitimately contain secret-like patterns, and
      # TruffleHog (--only-verified) + detect-secrets remain the blocking gates.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect --source . --redact \
            --report-format sarif --report-path results.sarif \
            --exit-code 0

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: gitleaks

  trufflehog:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          # Filesystem scan of the current tree. Avoids the diff-mode
          # "BASE and HEAD are the same" error the action raises on a push to
          # the default branch (base==head). Still fails on verified secrets.
          path: ./
          extra_args: --only-verified

  detect-secrets:
    name: Detect Secrets Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          # Scan all files and fail if secrets found
          detect-secrets scan --all-files --exclude-files '\.git/.*' \
            --exclude-files 'node_modules/.*' \
            --exclude-files '\.venv/.*' \
            --exclude-files 'sdks/nodejs.*/node_modules/.*' \
            > .secrets.baseline.new

          # Check for high-confidence secrets
          if detect-secrets audit --report --json .secrets.baseline.new | grep -q '"is_secret": true'; then
            echo "::error::Potential secrets detected! Please review and remove before merging."
            detect-secrets audit --report .secrets.baseline.new
            exit 1
          fi

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-baseline
          path: .secrets.baseline.new

  comment-on-failure:
    name: Comment on PR if secrets found
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, detect-secrets]
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## :rotating_light: Secret Scanning Failed

            One or more secret scanning tools detected potential credentials in this PR.

            **Action Required:**
            1. Review the workflow logs for details
            2. Remove any hardcoded secrets
            3. Use environment variables or a secrets manager instead
            4. If this is a false positive, update the \`.gitleaks.toml\` allowlist

            **Resources:**
            - [Managing secrets in GitHub](https://docs.github.com/en/actions/security-guides/encrypted-secrets)
            - [Best practices for secrets](https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html)

            ---
            *This check prevents credential leaks to protect the project and users.*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
